<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evening routine</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#5a49a8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Evening">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<style>
:root{--bg:#eceef6;--card:#fff;--ink:#1d2140;--mute:#6a6f92;--line:#d9dcec;--acc:#5a49a8;--accink:#fff;--sun:#f0a35c;--ok:#2f8f6b;--gl:42%;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15172c;--card:#1f2240;--ink:#eceefb;--mute:#9a9fc6;--line:#323660;--acc:#a898f0;--accink:#15172c;--sun:#f2b06d;--ok:#5fc79f;--gl:66%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15172c;--card:#1f2240;--ink:#eceefb;--mute:#9a9fc6;--line:#323660;--acc:#a898f0;--accink:#15172c;--sun:#f2b06d;--ok:#5fc79f;--gl:66%;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:560px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:2rem;line-height:1.1;margin:8px 0 4px;font-weight:800;letter-spacing:-.02em}
h2{font-size:1.1rem;margin:0 0 4px;font-weight:600}
.sub{color:var(--mute);margin:0 0 16px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin:16px 0}
.tabs button{flex:1;border:0;background:none;color:var(--mute);font:inherit;font-weight:600;padding:8px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--acc);color:var(--accink)}
.week{display:flex;gap:8px;margin:0 0 16px;align-items:center;flex-wrap:wrap}
.week i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.week i.on{background:var(--sun);border-color:var(--sun)}
.week i.today{outline:2px solid var(--acc);outline-offset:2px}
.week span{margin-left:auto;color:var(--mute);font-size:.9rem}
.bar{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:8px 0 4px}
.bar b{display:block;height:100%;background:var(--sun);border-radius:99px;transition:width .3s}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}
.row.done{opacity:.6}.row.done .nm{text-decoration:line-through}
.chk{width:30px;height:30px;border-radius:50%;border:2px solid var(--g,var(--acc));background:none;color:#fff;cursor:pointer;flex:none;font-size:16px;line-height:1}
.row.done .chk{background:var(--g,var(--ok))}
.grow{flex:1;min-width:0}.nm{font-weight:600}
.meta{color:var(--mute);font-size:.85rem}
.ghost{border:0;background:none;color:var(--mute);cursor:pointer;font:inherit;font-size:.85rem;padding:6px}
.ghost:hover{color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.gcard{border-left:6px solid var(--g)}
.gtop{display:flex;align-items:baseline;gap:10px}
.gnum{font-size:2.6rem;font-weight:800;line-height:1;color:var(--g);letter-spacing:-.03em}
.ghead{font-weight:600;font-size:.95rem;margin:16px 0 6px;padding-left:10px;border-left:6px solid var(--g,var(--line))}
.strip{height:8px;border-radius:99px;margin:10px 0 4px}
form{display:grid;gap:8px;margin-top:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.btn{font:inherit;font-weight:600;border:0;border-radius:10px;padding:10px 14px;background:var(--acc);color:var(--accink);cursor:pointer}
details{margin-top:12px}summary{cursor:pointer;color:var(--acc);font-weight:600;padding:6px 0}
.pill{display:inline-block;font-size:.8rem;border:1px solid var(--g,var(--line));border-radius:99px;padding:1px 8px;color:var(--mute);margin:0 4px 4px 0}
.badge{background:var(--sun);color:#1d2140;border-radius:99px;padding:1px 10px;font-size:.8rem;font-weight:600;margin-left:6px}
.empty{color:var(--mute);text-align:center;padding:24px 0}
.chead{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.chead button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;width:38px;height:38px;font:inherit;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.grid .wd{text-align:center;color:var(--mute);font-size:.8rem}
.d{aspect-ratio:1;border-radius:50%;border:2px solid transparent;background:var(--card);color:var(--ink);font:inherit;font-size:.9rem;cursor:pointer;padding:0}
.d.part{background:color-mix(in srgb,var(--sun) 30%,var(--card));border-color:var(--sun)}
.d.full{background:var(--sun);border-color:var(--sun);color:#1d2140;font-weight:600}
.d.fut{opacity:.35;cursor:default}
.d.today{outline:2px solid var(--acc);outline-offset:1px}
.d.sel{box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 35%,transparent)}
.key{display:flex;gap:14px;color:var(--mute);font-size:.85rem;margin:10px 0}
.key i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.bar b{transition:none}}
</style>
</head>
<body>
<main>
<h1>Evening routine</h1>
<p class="sub" id="date"></p>
<div class="tabs" role="tablist">
<button role="tab" data-tab="today" aria-selected="true">Tonight</button>
<button role="tab" data-tab="goals" aria-selected="false">Goals</button>
<button role="tab" data-tab="cal" aria-selected="false">Calendar</button>
</div>
<div id="view"></div>
</main>
<script>
(function(){
var KEY="evening-routine-v1",tab="today",now=new Date(),cm={y:now.getFullYear(),m:now.getMonth()},sel=null,pend=null,editing=null;
var uid=function(){return Math.random().toString(36).slice(2,9)};
var seed=function(){var g=uid(),f=uid();return{goals:[{id:g,name:"Free-standing handstand"},{id:f,name:"Sleep by 23:00"}],
habits:[{id:uid(),name:"Wall handstand holds",min:10,goal:g},{id:uid(),name:"Shoulder and wrist warm-up",min:5,goal:g},{id:uid(),name:"Screens off, lights low",min:0,goal:f}],log:{},tot:{}}};
var S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!S.habits)S=seed();
if(!S.tot)S.tot={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dk(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function doneOn(k){return (S.log[k]||[]).filter(function(id){return S.habits.some(function(h){return h.id===id})})}
function streak(){var d=new Date(),n=0;if(!doneOn(dk(d)).length)d.setDate(d.getDate()-1);
while(doneOn(dk(d)).length){n++;d.setDate(d.getDate()-1)}return n}
function best(){var ks=Object.keys(S.log).filter(function(k){return doneOn(k).length}).sort(),b=0,c=0,p=null;
ks.forEach(function(k){var t=new Date(k+"T12:00:00");c=(p&&Math.round((t-p)/864e5)===1)?c+1:1;if(c>b)b=c;p=t});return b}
function mile(n){var m=[[100,"100 days"],[60,"Two months"],[30,"One month"],[14,"Two weeks"],[7,"One week"],[3,"Warming up"]];
for(var i=0;i<m.length;i++)if(n>=m[i][0])return m[i][1];return""}
function sessions(gid){var n=0;for(var k in S.log){S.log[k].forEach(function(id){var h=S.habits.find(function(x){return x.id===id});if(h&&h.goal===gid)n++})}return n}
function goalName(id){var g=S.goals.find(function(x){return x.id===id});return g?g.name:""}
function gcol(n){return"hsl("+((255+n*5)%360)+" "+Math.min(72,40+n*1.5)+"% var(--gl))"}
function gstrip(n){var k=Math.min(n,8),s=[];if(!k)return gcol(0);for(var j=0;j<=k;j++)s.push(gcol(Math.round(n*j/k)));return"linear-gradient(90deg,"+s.join(",")+")"}
function gvar(id){return id?' style="--g:'+gcol(sessions(id))+'"':""}
function goalOpts(s){return '<option value="">No goal</option>'+S.goals.map(function(g){return'<option value="'+g.id+'"'+(g.id===s?" selected":"")+'>'+esc(g.name)+'</option>'}).join("")}
function editHabit(x){return '<form class="card" data-form="edith" data-id="'+x.id+'"><input name="name" value="'+esc(x.name)+'" required maxlength="60" aria-label="Habit name"><div style="display:flex;gap:8px"><input name="amt" type="number" min="0" max="999" value="'+(x.reps||x.min||"")+'" placeholder="Amount" aria-label="Amount"><select name="unit" aria-label="Unit" style="width:auto"><option value="min"'+(x.reps?"":" selected")+'>minutes</option><option value="reps"'+(x.reps?" selected":"")+'>reps</option></select></div><select name="goal" aria-label="Goal">'+goalOpts(x.goal)+'</select><div style="display:flex;gap:8px"><button class="btn">Save</button><button type="button" class="ghost" data-act="cancel">Cancel</button></div></form>'}

function today(){
var k=dk(new Date()),done=doneOn(k),total=S.habits.length,mins=S.habits.reduce(function(a,h){return a+h.min},0);
var pct=total?Math.round(done.length/total*100):0,dots="";
for(var i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);dots+='<i class="'+(doneOn(dk(d)).length?"on ":"")+(i===0?"today":"")+'" title="'+dk(d)+'"></i>'}
var st=streak(),ms=mile(st);
var h='<div class="week">'+dots+'<span>'+(st?st+" day"+(st>1?"s":"")+" in a row":"Start tonight")+(ms?'<b class="badge">'+ms+'</b>':"")+'</span></div>';
h+='<div class="card"><h2>'+(total&&done.length===total?"Routine complete":done.length+" of "+total+" done")+'</h2><div class="bar"><b style="width:'+pct+'%"></b></div><div class="meta">About '+mins+' minutes in total. Doing one thing still counts as a day.</div></div>';
if(!total)h+='<div class="empty">No habits yet. Add your first one below.</div>';
var order=S.goals.map(function(g){return g.id});order.push("");
order.forEach(function(gid){var gh=S.habits.filter(function(x){return(x.goal||"")===gid});if(!gh.length)return;
var tt=gid?esc(goalName(gid)):(S.goals.length?"Other habits":"");if(tt)h+='<div class="ghead"'+gvar(gid)+'>'+tt+'</div>';
gh.forEach(function(x,i){if(editing===x.id){h+=editHabit(x);return}var on=done.indexOf(x.id)>-1;
h+='<div class="row'+(on?" done":"")+'"'+gvar(x.goal)+'><button class="chk" data-act="toggle" data-id="'+x.id+'" aria-label="Mark '+esc(x.name)+' as done" aria-pressed="'+on+'">'+(on?"✓":"")+'</button><div class="grow"><div class="nm">'+esc(x.name)+'</div><div class="meta">'+(x.reps?x.reps+" reps":x.min?x.min+" min":"No target")+(x.goal?' <span class="pill">'+esc(goalName(x.goal))+'</span>':"")+'</div></div>'+
(i>0?'<button class="ghost" data-act="up" data-id="'+x.id+'" aria-label="Move earlier">Up</button>':"")+'<button class="ghost" data-act="edith" data-id="'+x.id+'">Edit</button><button class="ghost" data-act="delh" data-id="'+x.id+'" aria-label="Delete '+esc(x.name)+'">'+(pend===x.id?"Tap again to delete":"Delete")+'</button></div>'});});
h+='<details'+(total?"":" open")+'><summary>Add a habit</summary><form data-form="habit"><input name="name" placeholder="e.g. 10 minute stretch" required maxlength="60"><div style="display:flex;gap:8px"><input name="amt" type="number" min="0" max="999" placeholder="Amount (optional)"><select name="unit" aria-label="Unit" style="width:auto"><option value="min">minutes</option><option value="reps">reps</option></select></div><select name="goal">'+goalOpts()+'</select><button class="btn">Add habit</button></form></details>';
return h}

function goals(){
var h='<p class="sub">Each goal counts the sessions you finish and slowly changes colour as they add up. Linked habits share the colour.</p>';
if(!S.goals.length)h+='<div class="empty">No goals yet. Add one below.</div>';
S.goals.forEach(function(g){var n=sessions(g.id),hs=S.habits.filter(function(x){return x.goal===g.id});
if(editing===g.id){h+='<form class="card" data-form="editg" data-id="'+g.id+'"><input name="name" value="'+esc(g.name)+'" required maxlength="60" aria-label="Goal name"><div style="display:flex;gap:8px"><button class="btn">Save</button><button type="button" class="ghost" data-act="cancel">Cancel</button></div></form>';return}
h+='<div class="card gcard"'+gvar(g.id)+'><div class="gtop"><span class="gnum">'+n+'</span><h2>'+esc(g.name)+'</h2></div><div class="meta">session'+(n===1?"":"s")+' done</div><div class="strip" style="background:'+gstrip(n)+'"></div><div style="margin-top:8px">'+
(hs.length?hs.map(function(x){return'<span class="pill">'+esc(x.name)+'</span>'}).join(""):'<span class="meta">No habits linked yet.</span>')+'</div><button class="ghost" data-act="editg" data-id="'+g.id+'">Edit</button><button class="ghost" data-act="delg" data-id="'+g.id+'">'+(pend===g.id?"Tap again to delete":"Delete goal")+'</button></div>'});
h+='<details'+(S.goals.length?"":" open")+'><summary>Add a goal</summary><form data-form="goal"><input name="name" placeholder="e.g. Hold a handstand for 30 seconds" required maxlength="60"><button class="btn">Add goal</button></form></details>';
return h}

function cal(){
var y=cm.y,m=cm.m,lead=(new Date(y,m,1).getDay()+6)%7,dim=new Date(y,m+1,0).getDate(),tk=dk(new Date()),full=0,g="";
["Mo","Tu","We","Th","Fr","Sa","Su"].forEach(function(w){g+='<span class="wd">'+w+'</span>'});
for(var i=0;i<lead;i++)g+='<span></span>';
for(var d=1;d<=dim;d++){var k=dk(new Date(y,m,d)),dn=doneOn(k).length,tot=S.tot[k]||S.habits.length,c="d";
if(dn)c+=dn>=tot?" full":" part";if(dn&&dn>=tot)full++;if(k>tk)c+=" fut";if(k===tk)c+=" today";if(k===sel)c+=" sel";
g+='<button class="'+c+'"'+(k>tk?" disabled":"")+' data-act="sel" data-k="'+k+'" aria-label="'+k+'">'+d+'</button>'}
var st=streak(),h='<div class="card"><h2>'+(st?st+" day"+(st>1?"s":"")+" in a row":"No streak yet")+(mile(st)?'<b class="badge">'+mile(st)+'</b>':"")+'</h2><div class="meta">Best run: '+best()+' day'+(best()===1?"":"s")+'. Full routines this month: '+full+'.</div></div>';
h+='<div class="chead"><button data-act="prev" aria-label="Previous month">‹</button><h2>'+new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"})+'</h2><button data-act="next" aria-label="Next month">›</button></div><div class="grid">'+g+'</div>';
h+='<div class="key"><span><i style="background:var(--sun)"></i>Full routine</span><span><i style="border:2px solid var(--sun)"></i>Some habits</span></div>';
if(sel){var ds=doneOn(sel),nm=S.habits.filter(function(x){return ds.indexOf(x.id)>-1}).map(function(x){return esc(x.name)});
h+='<div class="card"><h2>'+new Date(sel+"T12:00:00").toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+'</h2><div class="meta">'+(nm.length?nm.join(", "):"Nothing logged this day.")+'</div></div>'}
return h}

function render(){
document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
document.getElementById("view").innerHTML=tab==="today"?today():tab==="goals"?goals():cal();
document.querySelectorAll(".tabs button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.tab===tab)})}

document.addEventListener("click",function(e){
var t=e.target.closest("[data-tab],[data-act]");if(!t){if(pend){pend=null;render()}return}
if(t.dataset.tab){tab=t.dataset.tab;editing=null;render();return}
var id=t.dataset.id,a=t.dataset.act,k=dk(new Date());if(a!=="delh"&&a!=="delg")pend=null;if(a==="edith"||a==="editg")editing=id;if(a==="cancel")editing=null;
if(a==="toggle"){var l=S.log[k]||[],i=l.indexOf(id);if(i>-1)l.splice(i,1);else l.push(id);S.log[k]=l;S.tot[k]=S.habits.length}
if(a==="up"){var j=S.habits.findIndex(function(x){return x.id===id}),p=j-1;while(p>=0&&(S.habits[p].goal||"")!==(S.habits[j].goal||""))p--;if(p>=0){var c=S.habits[j];S.habits[j]=S.habits[p];S.habits[p]=c}}
if(a==="delh"){if(pend===id){S.habits=S.habits.filter(function(x){return x.id!==id});pend=null}else pend=id}
if(a==="delg"){if(pend===id){S.goals=S.goals.filter(function(x){return x.id!==id});S.habits.forEach(function(x){if(x.goal===id)x.goal=""});pend=null}else pend=id}
if(a==="sel")sel=t.dataset.k;
if(a==="prev"||a==="next"){cm.m+=a==="next"?1:-1;if(cm.m<0){cm.m=11;cm.y--}if(cm.m>11){cm.m=0;cm.y++}}
save();render()});

document.addEventListener("submit",function(e){
var f=e.target.closest("form[data-form]");if(!f)return;e.preventDefault();
var d=new FormData(f),n=String(d.get("name")).trim();if(!n)return;
if(f.dataset.form==="habit")S.habits.push({id:uid(),name:n,min:d.get("unit")==="reps"?0:Math.max(0,parseInt(d.get("amt"))||0),reps:d.get("unit")==="reps"?Math.max(0,parseInt(d.get("amt"))||0):0,goal:d.get("goal")||""});
else if(f.dataset.form==="edith"){var hx=S.habits.find(function(y){return y.id===f.dataset.id});if(hx){var rp=d.get("unit")==="reps",am=Math.max(0,parseInt(d.get("amt"))||0);hx.name=n;hx.min=rp?0:am;hx.reps=rp?am:0;hx.goal=d.get("goal")||""}editing=null}
else if(f.dataset.form==="editg"){var gx=S.goals.find(function(y){return y.id===f.dataset.id});if(gx)gx.name=n;editing=null}
else S.goals.push({id:uid(),name:n});
save();render()});
render()})();
</script>
<script>if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
</body>
</html>
